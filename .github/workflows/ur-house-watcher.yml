name: UR House Watcher

on:
  schedule:
    # GitHub cron is UTC: 00:00 UTC = 09:00 JST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ur-house-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ur-house-watcher/requirements.txt

      - name: Install dependencies
        run: pip install -r ur-house-watcher/requirements.txt

      - name: Check UR vacancies
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set +e
          python ur-house-watcher/check_ur.py
          code=$?
          if [ "$code" -eq 10 ]; then
            echo "new_rooms=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$code"

      - name: Create GitHub Issue when new rooms appear
        if: steps.check.outputs.new_rooms == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🏠 UR 新空房 $(date -u +'%Y-%m-%d')" \
            --body-file ur-house-watcher/notification.md

      - name: Persist watcher state
        run: |
          if git diff --quiet -- ur-house-watcher/state.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ur-house-watcher/state.json
          git commit -m "chore: update UR vacancy state"
          git push
